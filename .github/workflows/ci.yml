name: Clinic checks
on:
  push:
    branches: [main, release/public-hosting]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify dashboard navigation
        run: |
          npm run preview -- --port 4173 --strictPort &
          curl --fail --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/
          MEDICARE_URL='http://127.0.0.1:4173/#management' node scripts/test-dashboard-stat-details.mjs
