name: Clinic checks
on:
  push:
    branches: [main, release/public-hosting]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: clinic_ci_only
          POSTGRES_DB: clinic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/hosting.cjs
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: clinic_ci_only
          PGDATABASE: clinic_ci
      - run: npm run build
      - run: npm run typecheck
