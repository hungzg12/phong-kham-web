name: MediCare checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Render and workspace regression tests
        run: node --test --test-concurrency=1 tests/roles-render.test.mjs tests/workspace-flow.test.mjs
      - run: npm run build
      # Full SQL tests require Windows PowerShell and an isolated SQL Server.
      # See VERIFICATION.md for the separate locally verified SQL suite.
